<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numerics Program</title>
<meta property="og:title" content="Numerics Program"><meta property="og:description" content="Numerics by Laurie Bloomfield: guided Build and Break programs for Primary, Grade 1 and Grade 2.">
<style>
body{margin:0;font-family:"Century Gothic","URW Gothic","Avenir Next",Futura,sans-serif;background:#EFEAE2;color:#1E3557}
header{background:#1F3864;color:#fff;padding:18px 28px;font-size:22px;font-weight:700;letter-spacing:.5px}
main{max-width:980px;margin:0 auto;padding:48px 24px}
h1{font-size:46px;margin:0 0 8px}
p.lead{font-size:19px;margin:0 0 36px;color:#3d4c63}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.card{background:#fff;border:2px solid #e3ddd2;border-radius:16px;padding:26px;text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:#355E3B;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card h2{margin:0 0 6px;font-size:28px}
.card .n{font-size:16px;color:#3d4c63;margin-bottom:18px}
.go{display:inline-block;background:#355E3B;color:#fff;border-radius:999px;padding:10px 20px;font-weight:700}
.soon{display:inline-block;background:#e3ddd2;color:#5b6475;border-radius:999px;padding:10px 20px;font-weight:700}
.card.off{opacity:.75}
footer{text-align:center;color:#6b7280;font-size:13px;padding:30px}
</style></head><body>
<header>Numerics</header>
<main>
<h1>Numerics Program</h1>
<p class="lead">Choose your grade. Each program gives you every lesson, day by day.</p>
<div class="grid">
<a class="card" href="primary/"><h2>Primary</h2><div class="n">Build and Break, Numbers 1 to 10</div><span class="go">Open Primary</span></a>
<div class="card off"><h2>Grade 1</h2><div class="n">Build and Break</div><span class="soon">Coming soon</span></div>
<div class="card off"><h2>Grade 2</h2><div class="n">Build and Break</div><span class="soon">Coming soon</span></div>
</div>
</main>
<footer>Numerics by Laurie Bloomfield · © 2026 Numerics. All rights reserved.</footer>
</body></html>
